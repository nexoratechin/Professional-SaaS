services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-college_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-college_erp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-college_erp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-college_erp}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-college_erp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-college_erp_minio_password}
    ports:
      - '${MINIO_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_PORT:-9101}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    # Optional AV engine for the worker's document-virus-scan queue. When
    # VIRUS_SCAN_PROVIDER=clamav the worker talks to this on 3310 (clamd INSTREAM). The default
    # worker provider is `mock`, so this service is only exercised when you opt in.
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav_data:/var/lib/clamav

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-college_erp}:${POSTGRES_PASSWORD:-college_erp_dev_password}@postgres:5432/${POSTGRES_DB:-college_erp}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-college_erp_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-college_erp_minio_password}
      S3_BUCKET: ${S3_BUCKET:-college-erp-documents}
      S3_FORCE_PATH_STYLE: 'true'
      DOCUMENT_MAX_UPLOAD_SIZE_BYTES: ${DOCUMENT_MAX_UPLOAD_SIZE_BYTES:-26214400}
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-cc8abfe479f38178bf712a90343e27496c0f31cde1778615eff668ad2b199cd2}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-college_erp}:${POSTGRES_PASSWORD:-college_erp_dev_password}@postgres:5432/${POSTGRES_DB:-college_erp}
      REDIS_URL: redis://redis:6379
      # MUST match the API's NOTIFICATION_SECRET_KEY — the worker decrypts what the API encrypted.
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-cc8abfe479f38178bf712a90343e27496c0f31cde1778615eff668ad2b199cd2}
      # Object storage for the document virus-scan + retention processors.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-college_erp_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-college_erp_minio_password}
      S3_BUCKET: ${S3_BUCKET:-college-erp-documents}
      S3_FORCE_PATH_STYLE: 'true'
      # Scan provider: mock (default), clamav (needs the clamav service started), or http.
      VIRUS_SCAN_PROVIDER: ${VIRUS_SCAN_PROVIDER:-mock}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      VIRUS_SCAN_API_URL: ${VIRUS_SCAN_API_URL:-}
      VIRUS_SCAN_API_KEY: ${VIRUS_SCAN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  pg_data:
  minio_data:
  clamav_data:
