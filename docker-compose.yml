services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-college_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-college_erp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-college_erp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-college_erp}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-college_erp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-college_erp_minio_password}
    ports:
      - '${MINIO_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_PORT:-9101}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    # Optional AV engine for the worker's document-virus-scan queue. When
    # VIRUS_SCAN_PROVIDER=clamav the worker talks to this on 3310 (clamd INSTREAM). The default
    # worker provider is `mock`, so this service is only exercised when you opt in.
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav_data:/var/lib/clamav

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-college_erp}:${POSTGRES_PASSWORD:-college_erp_dev_password}@postgres:5432/${POSTGRES_DB:-college_erp}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-college_erp_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-college_erp_minio_password}
      S3_BUCKET: ${S3_BUCKET:-college-erp-documents}
      S3_FORCE_PATH_STYLE: 'true'
      DOCUMENT_MAX_UPLOAD_SIZE_BYTES: ${DOCUMENT_MAX_UPLOAD_SIZE_BYTES:-26214400}
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-cc8abfe479f38178bf712a90343e27496c0f31cde1778615eff668ad2b199cd2}
      # Deliberately a different key from NOTIFICATION_SECRET_KEY: one leaked integration key must not
      # decrypt notification credentials (and vice versa). See .env.example.
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-3f1c9a2b7e4d6085b13c2f7a9e0d41638cb25fe970a1d6438be5072ca4f18d93}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@college-erp.local}
      # Comma-separated origins; set CORS_ORIGIN=http://localhost:8080 when using the web-prod
      # profile below.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Enterprise database isolation (off by default; see docs/enterprise-database-isolation.md).
      TENANT_DB_ISOLATION_ENABLED: ${TENANT_DB_ISOLATION_ENABLED:-false}
      TENANT_DB_SECRET_KEY: ${TENANT_DB_SECRET_KEY:-}
      TENANT_DB_ADMIN_URL: ${TENANT_DB_ADMIN_URL:-}
      TENANT_DB_SCHEMA_PREFIX: ${TENANT_DB_SCHEMA_PREFIX:-tenant_}
      TENANT_DB_DATABASE_PREFIX: ${TENANT_DB_DATABASE_PREFIX:-college_erp_tenant_}
      TENANT_DB_MIGRATION_MODE: ${TENANT_DB_MIGRATION_MODE:-auto}
      TENANT_DB_MAX_CLIENTS: ${TENANT_DB_MAX_CLIENTS:-10}
      # Production observability (see docs/observability.md).
      LOG_FORMAT: ${LOG_FORMAT:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_INCLUDE_TENANT_LABELS: ${METRICS_INCLUDE_TENANT_LABELS:-false}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-3000}
      ALERTING_ENABLED: ${ALERTING_ENABLED:-true}
      ALERT_EVAL_INTERVAL_MS: ${ALERT_EVAL_INTERVAL_MS:-60000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_DEDUPE_MINUTES: ${ALERT_DEDUPE_MINUTES:-15}
      WORKER_EXPECTED_REPLICAS: ${WORKER_EXPECTED_REPLICAS:-1}
      ERROR_TRACKING_ENABLED: ${ERROR_TRACKING_ENABLED:-true}
      ERROR_TRACKING_WEBHOOK_URL: ${ERROR_TRACKING_WEBHOOK_URL:-}
      ERROR_TRACKING_PERSIST: ${ERROR_TRACKING_PERSIST:-true}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/live || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-college_erp}:${POSTGRES_PASSWORD:-college_erp_dev_password}@postgres:5432/${POSTGRES_DB:-college_erp}
      REDIS_URL: redis://redis:6379
      # MUST match the API's NOTIFICATION_SECRET_KEY - the worker decrypts what the API encrypted.
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-cc8abfe479f38178bf712a90343e27496c0f31cde1778615eff668ad2b199cd2}
      # MUST match the API's INTEGRATION_SECRET_KEY - the worker decrypts integration credentials at
      # dispatch time, exactly as it does for notification provider credentials.
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-3f1c9a2b7e4d6085b13c2f7a9e0d41638cb25fe970a1d6438be5072ca4f18d93}
      # MUST match the API's VAPID_* so browser subscriptions registered via the API can be
      # delivered by the worker.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@college-erp.local}
      # Object storage for the document virus-scan + retention processors.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-college_erp_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-college_erp_minio_password}
      S3_BUCKET: ${S3_BUCKET:-college-erp-documents}
      S3_FORCE_PATH_STYLE: 'true'
      # Scan provider: mock (default), clamav (needs the clamav service started), or http.
      VIRUS_SCAN_PROVIDER: ${VIRUS_SCAN_PROVIDER:-mock}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      VIRUS_SCAN_API_URL: ${VIRUS_SCAN_API_URL:-}
      VIRUS_SCAN_API_KEY: ${VIRUS_SCAN_API_KEY:-}
      # MUST match the API's PUBLIC_BASE_URL (certificate QR codes) and payment gateway adapter.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      PAYMENTS_GATEWAY: ${PAYMENTS_GATEWAY:-mock}
      # MUST match the API's enterprise isolation settings so jobs route to the same store.
      TENANT_DB_ISOLATION_ENABLED: ${TENANT_DB_ISOLATION_ENABLED:-false}
      TENANT_DB_SECRET_KEY: ${TENANT_DB_SECRET_KEY:-}
      TENANT_DB_MAX_CLIENTS: ${TENANT_DB_MAX_CLIENTS:-10}
      # Production observability: heartbeat into Redis (the API's worker_offline alert + readiness
      # probe count it) and expose /health + /metrics on WORKER_HEALTH_PORT.
      LOG_FORMAT: ${LOG_FORMAT:-}
      WORKER_HEALTH_ENABLED: ${WORKER_HEALTH_ENABLED:-true}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3100}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-3000}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-15000}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-45}
      ERROR_TRACKING_ENABLED: ${ERROR_TRACKING_ENABLED:-true}
      ERROR_TRACKING_WEBHOOK_URL: ${ERROR_TRACKING_WEBHOOK_URL:-}
      ERROR_TRACKING_PERSIST: ${ERROR_TRACKING_PERSIST:-true}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/health/live || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    ports:
      - '${WORKER_HEALTH_PORT:-3100}:3100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - '5173:5173'
    depends_on:
      - api

  # Production-style PWA image (static Vite build + nginx). Off by default so the dev flow above
  # is unchanged; start it with:
  #   docker compose --profile prod up --build web-prod
  # and set CORS_ORIGIN=http://localhost:8080 for the api service.
  web-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        VITE_API_URL: ${WEB_PROD_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - '${WEB_PROD_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  pg_data:
  minio_data:
  clamav_data:
