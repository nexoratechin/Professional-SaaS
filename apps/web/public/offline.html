<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e293b" />
    <title>Offline · College ERP</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: linear-gradient(135deg, #4f46e5, #1e3a8a);
        color: #fff;
        font-size: 32px;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button,
      a.button {
        display: inline-block;
        border: 0;
        cursor: pointer;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 12px 20px;
        text-decoration: none;
        font-size: 0.95rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #e2e8f0;
        }
        .card {
          background: #0f172a;
          border-color: #1e293b;
        }
        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">C</div>
      <h1>You're offline</h1>
      <p>
        College ERP needs a connection for this page. Cached pages you have already visited may
        still be available — reconnect and try again.
      </p>
      <a class="button" href="/dashboard">Retry</a>
    </div>
  </body>
</html>
