server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the SPA (the API sets its own via helmet; these cover the static origin).
  # CSP allows the app's own bundle plus the API/storage origins it talks to; it blocks inline
  # scripts (the app ships none) and framing (clickjacking).
  #
  # NOTE: nginx does not inherit server-level `add_header` into a location that declares its own
  # `add_header`, so the cache headers below use `expires` (which is not an `add_header`) to keep
  # these security headers applied to every response.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: http:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # The service worker and manifest must never be pinned by the browser for long, otherwise a
  # deployed update can be stuck on an old precache manifest. `expires -1` emits Cache-Control:
  # no-cache.
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    expires -1;
    try_files $uri =404;
  }
  location = /push-sw.js {
    expires -1;
    try_files $uri =404;
  }

  # Content-hashed Vite assets are safe to cache for a long time.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback for every client route and the offline shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
