server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker and manifest must never be cached by the browser for long, otherwise a
  # deployed update can be pinned to an old precache manifest.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /push-sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Content-hashed Vite assets are safe to cache immutably.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback for every client route and the offline shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
