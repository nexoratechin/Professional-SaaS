name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://college_erp:college_erp_ci_password@localhost:3306/college_erp
      REDIS_URL: redis://localhost:6379
      # Object storage uses the local filesystem driver on the runner — no MinIO/S3 service needed.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .data/storage
      JWT_PRIVATE_KEY: ${{ secrets.CI_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.CI_JWT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Native MySQL + Redis on the runner — no Docker service containers.
      - name: Install and start MySQL + Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server mysql-client redis-server
          sudo systemctl enable --now mysql
          sudo systemctl enable --now redis-server
          sudo mysql -e "CREATE DATABASE college_erp;"
          sudo mysql -e "CREATE USER 'college_erp'@'%' IDENTIFIED BY 'college_erp_ci_password';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON *.* TO 'college_erp'@'%'; FLUSH PRIVILEGES;"
          mysqladmin ping -h 127.0.0.1 -u college_erp -pcollege_erp_ci_password
          redis-cli ping

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate + generate
        run: |
          pnpm --filter @college-erp/database prisma:validate
          pnpm --filter @college-erp/database prisma:generate

      - name: Run migrations
        run: pnpm --filter @college-erp/database exec prisma migrate deploy

      - name: Automated recovery test (backup → verify → restore)
        env:
          RECOVERY_TEST_DATABASE_URL: mysql://college_erp:college_erp_ci_password@localhost:3306/college_erp
        run: pnpm --filter @college-erp/backup test:recovery

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: E2E tests (includes tenant-isolation suite)
        run: pnpm turbo run test:e2e
