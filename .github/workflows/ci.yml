name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://college_erp:college_erp_ci_password@localhost:5432/college_erp
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY: ${{ secrets.CI_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.CI_JWT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Native PostgreSQL + Redis on the runner — no Docker service containers.
      - name: Install and start PostgreSQL + Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server
          sudo systemctl enable --now postgresql
          sudo systemctl enable --now redis-server
          sudo -u postgres psql -c "CREATE ROLE college_erp LOGIN PASSWORD 'college_erp_ci_password' CREATEDB;"
          sudo -u postgres psql -c "CREATE DATABASE college_erp OWNER college_erp;"
          pg_isready -h localhost -p 5432
          redis-cli ping

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate + generate
        run: |
          pnpm --filter @college-erp/database prisma:validate
          pnpm --filter @college-erp/database prisma:generate

      - name: Run migrations
        run: pnpm --filter @college-erp/database exec prisma migrate deploy

      - name: Automated recovery test (backup → verify → restore)
        env:
          RECOVERY_TEST_DATABASE_URL: postgresql://college_erp:college_erp_ci_password@localhost:5432/college_erp
        run: pnpm --filter @college-erp/backup test:recovery

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: E2E tests (includes tenant-isolation suite)
        run: pnpm turbo run test:e2e
